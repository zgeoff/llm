# The catalog every llm command reads. src/catalog/catalog-schema.ts defines each key.
machine:
  modelsDir: 'D:\models'
  binDir: 'C:\llm\bin'
  rocmLibDir: 'C:\llm\rocm-10.0\Lib\site-packages\_rocm_sdk_libraries\bin'
  devices: { vulkan: Vulkan0, rocm: ROCm1 }
  llamaSwap:
    {
      listen: '0.0.0.0:8181',
      configPath: 'C:\llm\llama-swap.yaml',
      logPath: 'C:\llm\logs\llama-swap.log',
      startPort: 10001,
      globalTTL: 900,
    }
  proxy: { port: 8182 }

