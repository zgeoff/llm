# Git hooks. pre-commit fixes staged files only (fast); pre-push comes from
# the chex baseline, which runs its jobs one at a time, each under diet's
# memory cap, and lints and tests only what the branch changes. CI runs every
# whole-tree check.

extends:
  - node_modules/@zgeoff/chex/lefthook.yml

pre-commit:
  piped: true
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: &chex-baseline |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,css,yml,yaml,html}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format-codemod
      glob: '*.{ts,tsx}'
      run: node_modules/.bin/format-codemod --quiet {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  # Sequential, to bound memory on a small host or with parallel agents.
  piped: true
  # The baseline's chex-test job runs rig related, which llm does not install,
  # so exclude_tags drops it and the test job below runs llm's own runner.
  exclude_tags:
    - chex-test
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: *chex-baseline
    - name: test
      files:
        unset $(git rev-parse --local-env-vars); bun
        node_modules/@zgeoff/chex/src/branch/read-branch-files.ts
      glob: '*.{ts,tsx,toml}'
      run: '{clear-git-env} bun x --no-install diet -- bun run test:related {files}'
